# OpenWeedLocator Configuration File - Jetson Orin Nano Super Optimized
# This configuration is optimized for NVIDIA Jetson Orin Nano Super
# High performance, high resolution settings with GPU acceleration

[Camera]
# High resolution settings - Jetson Orin Nano Super can handle 1080p
resolution_width = 1280
resolution_height = 720
exp_compensation = 0

[System]
# Enhanced performance settings
algorithm = exhsv
relay_num = 4
actuation_duration = 0.75
delay = 0.05  # Faster response time due to better processing power
input_file_or_directory = 

[GreenOnBrown]
# Optimized thresholds for higher resolution
exg_min = 25
exg_max = 200
hue_min = 35
hue_max = 85
saturation_min = 35
saturation_max = 255
brightness_min = 10
brightness_max = 190
min_detection_area = 50  # Larger detection area for higher resolution
invert_hue = false

[GreenOnGreen]
# GPU-accelerated machine learning settings
model_path = models/
confidence = 0.45  # Lower confidence threshold due to better model performance
use_tensorrt = true
max_batch_size = 2  # Jetson can handle larger batches

[Relays]
# GPIO pin assignments (Jetson 40-pin header compatible with RPi)
0 = 13
1 = 15
2 = 16
3 = 18

[Controller]
# Enhanced controller support
controller_type = none
# controller_type = ute
# controller_type = advanced

# Ute controller settings
switch_purpose = recording
switch_pin = 37

# Advanced controller settings
recording_pin = 38
sensitivity_pin = 40
detection_mode_pin_up = 36
detection_mode_pin_down = 35
low_sensitivity_config = config/DAY_SENSITIVITY_1.ini
high_sensitivity_config = config/DAY_SENSITIVITY_3.ini

[DataCollection]
# Enhanced data collection for higher resolution
sample_images = false
sample_frequency = 60
sample_method = whole
disable_detection = false
save_directory = 
camera_name = jetson_csi

[Visualisation]
# Optimized for higher resolution display
image_loop_time = 1000
log_fps = true  # Monitor performance on Jetson