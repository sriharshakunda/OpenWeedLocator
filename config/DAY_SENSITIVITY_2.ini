[System]
# select your algorithm
algorithm = exhsv
# operate on a video, image or directory of media
input_file_or_directory =
# choose how many relays are connected to the OWL
relay_num = 4
actuation_duration = 0.15
delay = 0

[Controller]
# choose between 'none', 'ute' or 'advanced' - avoid using '' or "". Just plain text only: none or ute or advanced
controller_type = none

# for advanced controller
detection_mode_pin_up = 35
detection_mode_pin_down = 36
recording_pin = 38
sensitivity_pin = 40
low_sensitivity_config = config/DAY_SENSITIVITY_2.ini
high_sensitivity_config = config/DAY_SENSITIVITY_3.ini

# for UteController
switch_purpose = recording
switch_pin = 37

[Visualisation]
image_loop_time = 5

[Camera]
resolution_width = 640
resolution_height = 480
exp_compensation = -2
# Arducam specific settings
arducam_exposure = 4000
arducam_green_factor = 1.0
arducam_red_factor = 1.1
arducam_blue_factor = 1.25
arducam_brightness_alpha = 1.2
arducam_brightness_beta = 30

[GreenOnGreen]
# Green-on-green detection using HSV color space (Jetson compatible)
# HSV thresholds for green vegetation
hue_min = 30
hue_max = 85
saturation_min = 40
saturation_max = 255
value_min = 40
value_max = 255

# Morphological operations for noise reduction
erode_iterations = 2
dilate_iterations = 2
blur_kernel = 5

# Size filtering (in pixels)
min_detection_area = 100
max_detection_area = 5000

# Detection confidence threshold
confidence = 0.5

[GreenOnGreenML]
# YOLO-based green-on-green detection with crop-specific models
# Crop type determines which model to load
crop_type = test
# Available: wheat, corn, soybean, cotton, general, test

# Model configuration
model_directory = models/yolo
confidence_threshold = 0.5
nms_threshold = 0.4
input_size = 640

# Class filtering (empty = detect all classes)
# Examples: "0,1,2" for class IDs or "weed,grass,broadleaf" for names
target_classes = 

# Detection area filtering (pixels)
min_detection_area = 100
max_detection_area = 50000

[GreenOnBrown]
# parameters related to green-on-brown detection
exg_min = 25
exg_max = 200
hue_min = 39
hue_max = 83
saturation_min = 50
saturation_max = 220
brightness_min = 60
brightness_max = 190
min_detection_area = 10
invert_hue = False

[DataCollection]
# all data collection related parameters
# set sample_images True/False to enable/disable image collection
sample_images = False
# image collection, sample method include: 'bbox' | 'square' | 'whole'
sample_method = whole
sample_frequency = 30
save_directory = /media/owl/SanDisk
# set to True to disable weed detection for data collection only
disable_detection = False
# log fps
log_fps = False
camera_name = cam1

[Relays]
# defines the relay ID (left) that matches to a boardpin (right) on the Pi.
# Only change if you rewire/change the relay connections.
0 = 13
1 = 15
2 = 16
3 = 18


