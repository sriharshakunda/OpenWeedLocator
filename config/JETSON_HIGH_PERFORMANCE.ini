# OpenWeedLocator Configuration File - Jetson High Performance
# Maximum performance configuration for Jetson Orin series
# 1080p processing with aggressive optimization

[Camera]
# Maximum resolution settings
resolution_width = 1920
resolution_height = 1080
exp_compensation = 0

[System]
# Maximum performance settings
algorithm = gog  # Use Green-on-Green for best AI performance
relay_num = 4
actuation_duration = 0.5
delay = 0.02  # Minimal delay for fastest response
input_file_or_directory = 

[GreenOnBrown]
# Backup settings if Green-on-Green not available
exg_min = 20
exg_max = 220
hue_min = 30
hue_max = 90
saturation_min = 30
saturation_max = 255
brightness_min = 5
brightness_max = 200
min_detection_area = 100  # Larger area for 1080p
invert_hue = false

[GreenOnGreen]
# Maximum AI performance settings
model_path = models/
confidence = 0.4  # Lower threshold for maximum detection
use_tensorrt = true
max_batch_size = 4  # Larger batch for better GPU utilization
enable_fp16 = true  # Half precision for speed

[Relays]
# Standard GPIO pin assignments
0 = 13
1 = 15
2 = 16
3 = 18

[Controller]
# High-performance controller settings
controller_type = advanced

# Advanced controller settings
recording_pin = 38
sensitivity_pin = 40
detection_mode_pin_up = 36
detection_mode_pin_down = 35
low_sensitivity_config = config/DAY_SENSITIVITY_1.ini
high_sensitivity_config = config/DAY_SENSITIVITY_3.ini

[DataCollection]
# High-resolution data collection
sample_images = false
sample_frequency = 30  # More frequent sampling due to higher performance
sample_method = bbox  # Bounding box for efficient storage
disable_detection = false
save_directory = 
camera_name = jetson_csi_hd

[Visualisation]
# High-performance visualization
image_loop_time = 500  # Faster display updates
log_fps = true