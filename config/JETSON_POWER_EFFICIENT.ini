# OpenWeedLocator Configuration File - Jetson Power Efficient
# Balanced performance and power consumption for extended operation
# Optimized for battery-powered applications

[Camera]
# Moderate resolution for power efficiency
resolution_width = 640
resolution_height = 480
exp_compensation = 0

[System]
# Power-efficient settings
algorithm = exhsv  # Less computationally intensive than AI
relay_num = 4
actuation_duration = 1.0
delay = 0.1
input_file_or_directory = 

[GreenOnBrown]
# Standard detection thresholds
exg_min = 30
exg_max = 250
hue_min = 40
hue_max = 80
saturation_min = 40
saturation_max = 255
brightness_min = 15
brightness_max = 180
min_detection_area = 20
invert_hue = false

[GreenOnGreen]
# Power-efficient AI settings
model_path = models/
confidence = 0.5
use_tensorrt = false  # Disable GPU acceleration to save power
max_batch_size = 1

[Relays]
# Standard GPIO pin assignments
0 = 13
1 = 15
2 = 16
3 = 18

[Controller]
# Basic controller support
controller_type = ute

# Ute controller settings (single switch)
switch_purpose = detection
switch_pin = 37

[DataCollection]
# Minimal data collection for power efficiency
sample_images = false
sample_frequency = 120  # Less frequent sampling
sample_method = square
disable_detection = false
save_directory = 
camera_name = jetson_csi_efficient

[Visualisation]
# Power-efficient visualization
image_loop_time = 2000  # Slower updates to save power
log_fps = false  # Disable FPS logging to reduce CPU usage